name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate version and prepare release notes
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8').replace(/^\uFEFF/, ''))
          const tag = process.env.RELEASE_TAG
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag) || tag !== 'v' + pkg.version) {
            throw new Error('Release tag must match package.json version: v' + pkg.version)
          }

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/^\uFEFF/, '')
          const lines = changelog.split(/\r?\n/)
          const start = lines.findIndex((line) => line.trim() === '## ' + pkg.version)
          if (start < 0) throw new Error('Missing CHANGELOG entry for ' + pkg.version)
          let end = start + 1
          while (end < lines.length && !/^##\s/.test(lines[end])) end++
          const changes = lines.slice(start + 1, end).join('\n').trim()
          if (!changes) throw new Error('The release notes must not be empty')

          const notesPath = path.join(process.env.RUNNER_TEMP, 'release-notes.md')
          const repositoryUrl = 'https://github.com/' + process.env.GITHUB_REPOSITORY
          const notes = changes + '\n\n## Installation\n\n' +
            'In DSH, open **Plugins → Add plugin**, enter `dsh-exa-search`, and enable it after installation.\n\n' +
            'Web profile:\n\n```sh\ndsh plugin --profile web add dsh-exa-search\n```\n\n' +
            'The `.tgz` asset below can also be installed through the DSH plugin manager.\n\n' +
            '[中文文档](' + repositoryUrl + '/blob/' + tag + '/README.md) · ' +
            '[English documentation](' + repositoryUrl + '/blob/' + tag + '/README.en.md)\n'
          fs.writeFileSync(notesPath, notes)
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'version=' + pkg.version + '\nnotes=' + notesPath + '\nprerelease=' + pkg.version.includes('-') + '\n')
          NODE

      - name: Check syntax
        run: |
          node --check index.js
          node --check client.js

      - name: Run tests
        run: npm test

      - name: Build npm package
        id: package
        run: |
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack-result.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          const [packed] = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'pack-result.json'), 'utf8'))
          if (!packed || packed.name !== 'dsh-exa-search' || path.basename(packed.filename) !== packed.filename) {
            throw new Error('Unexpected package output')
          }
          const privateFile = /(^|\/)(?:\.env(?:\..*)?|\.npmrc|\.credentials\.ya?ml|state\.json)$|\.bak(?:-|$)|\.log$/
          for (const file of packed.files) {
            if (privateFile.test(file.path)) throw new Error('Private file in package: ' + file.path)
          }
          const archive = path.join(process.env.RUNNER_TEMP, packed.filename)
          if (!fs.existsSync(archive)) throw new Error('Package archive was not created')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'archive=' + archive + '\n')
          NODE

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          flags=(--latest)
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
            --verify-tag \
            --title "$RELEASE_TAG · Exa Search for DeepSeek Harness" \
            --notes-file "$RELEASE_NOTES" \
            "${flags[@]}"
